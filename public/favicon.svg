<!-- The static split. Numbers come from src/lib/marvin/orb-geometry.ts —
     a static asset cannot import, so keep the two in step by hand.
     Left half: the normal orb's eye. Right half: Marvin's. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <clipPath id="l"><rect x="0" y="0" width="100" height="200"/></clipPath>
  <clipPath id="r"><rect x="100" y="0" width="100" height="200"/></clipPath>
  <rect width="200" height="200" fill="#ffffff"/>
  <circle cx="100" cy="100" r="94" fill="#fafaf8" stroke="#e2e2de" stroke-width="2"/>
  <g clip-path="url(#l)">
    <ellipse cx="62" cy="94" rx="24" ry="14" fill="#ffffff" stroke="#2c2c2a" stroke-width="6"/>
    <ellipse cx="138" cy="94" rx="24" ry="14" fill="#ffffff" stroke="#2c2c2a" stroke-width="6"/>
  </g>
  <g clip-path="url(#r)">
    <polygon points="38,86 86,76 62,128" fill="#c23b3b"/>
    <polygon points="114,76 162,86 138,128" fill="#c23b3b"/>
  </g>
  <line x1="100" y1="10" x2="100" y2="190" stroke="#e2e2de" stroke-width="2"/>
</svg>

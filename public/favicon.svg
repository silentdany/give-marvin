  <g transform="translate(0 0) scale(0.16)">
  <defs>
  <radialGradient id="orb-shell" cx="38%" cy="26%" r="86%">
  <stop offset="0%" stop-color="#ececea"/>
  <stop offset="55%" stop-color="#dadad7"/>
  <stop offset="100%" stop-color="#c3c3bf"/>
  </radialGradient>
  <linearGradient id="orb-cut" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#45e6ad"/>
  <stop offset="100%" stop-color="#23cf98"/>
  </linearGradient>
  <filter id="orb-glow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="orb-ball">
  <circle cx="100" cy="100" r="88"/>
  </clipPath>
  </defs>
  <circle cx="100" cy="100" r="88" fill="url(#orb-shell)"/>
  <g clip-path="url(#orb-ball)">
